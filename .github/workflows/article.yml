# 오늘의 기사(v11 4단계, 2026-11-02): KBS WORLD 독일어 뉴스에서 평일 기사를 골라 공부 자료와 함께 앱에 넣는다.
# 11:05 KST = 그날 기사 + 한 편 더 2편 · 17:35 KST = 오후 기사로 한 편 더 보충. 주말은 돌지 않는다.
# 비밀값: APP_URL · API_TOKEN · GEMINI_API_KEY · GROQ_API_KEY · DISCORD_WEBHOOK_URL (daily.yml 과 같음)
name: article

on:
  schedule:
    - cron: '5 2 * * 1-5' # 한국 평일 11:05
    - cron: '35 8 * * 1-5' # 한국 평일 17:35
  workflow_dispatch:
    inputs:
      slot:
        description: 'morning(그날 기사) | afternoon(한 편 더 보충)'
        default: morning
      dry:
        description: '서버에 쓰지 않고 고른 것만'
        type: boolean
        default: false

concurrency: article

permissions:
  contents: read

jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: ${{ secrets.APP_URL }}
      API_TOKEN: ${{ secrets.API_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          check-latest: true
      - name: 앱 주소 점검
        run: node scripts/verify-deploy.mjs --app
      - name: run.mjs
        run: |
          SLOT="${{ inputs.slot }}"
          if [ -z "$SLOT" ]; then
            if [ "$(date -u +%H)" -lt 6 ]; then SLOT=morning; else SLOT=afternoon; fi
          fi
          node scripts/articles/run.mjs --slot "$SLOT" ${{ inputs.dry && '--dry' || '' }}
